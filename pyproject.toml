[project]
name = "ai-clipper"
version = "0.1.0"
description = "A modular desktop application for creating YouTube Shorts from long-form videos."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.core", "src.downloader"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
